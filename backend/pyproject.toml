[project]
name = "code-review-assistant"
version = "1.0.0"
description = "AI-powered code review: security and maintainability reviewers behind a FastAPI service and a CLI."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.5,<3",
    "openai>=2.0,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
code-review = "code_review.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["code_review*"]

[tool.setuptools.package-data]
code_review = ["prompts/*.md", "sample_files/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["code_review/sample_files"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long user-facing message strings are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
