# Render Blueprint for a free, demo-only deployment (no AI provider is ever called).
# Do NOT add LLM_API_KEY / OPENROUTER_API_KEY in the Render dashboard. See docs/deployment.md.
services:
  - type: web
    name: ai-code-review-assistant
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENABLE_LIVE_REVIEW
        value: "false"
